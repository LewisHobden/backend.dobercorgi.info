name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pushing to the registry happens in release.yml, so this only checks that the image builds.
      - name: Build Docker Container
        run: docker build . -t backend.dobercorgi.info
